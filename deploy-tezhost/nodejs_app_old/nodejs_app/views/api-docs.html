<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Multi-Tenant API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Header */
    .header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }
    .header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .header p {
      color: #94a3b8;
      font-size: 1.1rem;
    }
    .version {
      display: inline-block;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #60a5fa;
      margin-top: 0.75rem;
    }

    /* Stats */
    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 2rem 0;
      flex-wrap: wrap;
    }
    .stat-card {
      background: rgba(30,41,59,0.6);
      border: 1px solid rgba(148,163,184,0.1);
      border-radius: 12px;
      padding: 1.25rem 2rem;
      text-align: center;
      backdrop-filter: blur(10px);
      min-width: 150px;
    }
    .stat-card .number {
      font-size: 1.75rem;
      font-weight: 700;
      color: #60a5fa;
    }
    .stat-card .label {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Search */
    .search-box {
      display: flex;
      gap: 0.75rem;
      margin: 2rem 0;
      flex-wrap: wrap;
    }
    .search-box input {
      flex: 1;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.15);
      background: rgba(30,41,59,0.6);
      color: #e2e8f0;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.2s;
      min-width: 200px;
    }
    .search-box input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .search-box input::placeholder { color: #64748b; }
    .filter-btns {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.15);
      background: rgba(30,41,59,0.6);
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: #3b82f6; color: #e2e8f0; }
    .filter-btn.active {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-color: transparent;
      color: white;
    }

    /* Endpoint Categories */
    .category {
      margin-bottom: 2rem;
    }
    .category h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
      padding-left: 0.5rem;
    }
    .endpoint-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 0.75rem;
    }

    /* Endpoint Card */
    .endpoint-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.1rem;
      background: rgba(30,41,59,0.5);
      border: 1px solid rgba(148,163,184,0.08);
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .endpoint-card:hover {
      background: rgba(30,41,59,0.8);
      border-color: rgba(59,130,246,0.3);
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    .method-badge {
      padding: 0.25rem 0.6rem;
      border-radius: 5px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      min-width: 50px;
      text-align: center;
    }
    .method-badge.get { background: rgba(34,197,94,0.15); color: #22c55e; }
    .method-badge.post { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .method-badge.put { background: rgba(234,179,8,0.15); color: #eab308; }
    .method-badge.patch { background: rgba(168,85,247,0.15); color: #a78bfa; }
    .method-badge.delete { background: rgba(239,68,68,0.15); color: #ef4444; }
    
    .endpoint-path {
      font-size: 0.85rem;
      font-weight: 500;
      color: #e2e8f0;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: -0.01em;
      word-break: break-all;
    }
    .endpoint-desc {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.15rem;
    }
    .endpoint-info { flex: 1; min-width: 0; }
    .endpoint-icon {
      flex-shrink: 0;
      opacity: 0.4;
      transition: opacity 0.2s;
    }
    .endpoint-card:hover .endpoint-icon { opacity: 0.8; }

    /* Footer */
    .footer {
      text-align: center;
      padding: 3rem 1rem;
      color: #475569;
      font-size: 0.85rem;
    }
    .footer a { color: #60a5fa; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #1e293b;
      border: 1px solid rgba(148,163,184,0.15);
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
      transform: translateY(120px);
      opacity: 0;
      transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      .header h1 { font-size: 1.75rem; }
      .endpoint-grid { grid-template-columns: 1fr; }
      .stats { gap: 1rem; }
      .stat-card { min-width: 120px; padding: 1rem 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <span class="badge">⚡ REST API</span>
      <h1>ERP Multi-Tenant API</h1>
      <p>Backend service for the Multi-Tenant ERP System</p>
      <span class="version">v1.0.0</span>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="number" id="totalEndpoints">0</div>
        <div class="label">Endpoints</div>
      </div>
      <div class="stat-card">
        <div class="number" style="color:#22c55e">GET</div>
        <div class="label">Read</div>
      </div>
      <div class="stat-card">
        <div class="number" style="color:#60a5fa">POST</div>
        <div class="label">Create</div>
      </div>
      <div class="stat-card">
        <div class="number" style="color:#eab308">PUT</div>
        <div class="label">Update</div>
      </div>
      <div class="stat-card">
        <div class="number" style="color:#ef4444">DEL</div>
        <div class="label">Delete</div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍  Search endpoints..." oninput="filterEndpoints()">
      <div class="filter-btns">
        <button class="filter-btn active" data-method="all" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" data-method="get" onclick="setFilter('get', this)">GET</button>
        <button class="filter-btn" data-method="post" onclick="setFilter('post', this)">POST</button>
        <button class="filter-btn" data-method="put" onclick="setFilter('put', this)">PUT</button>
        <button class="filter-btn" data-method="delete" onclick="setFilter('delete', this)">DELETE</button>
      </div>
    </div>

    <!-- Endpoints -->
    <div id="endpointsContainer"></div>

    <!-- Footer -->
    <div class="footer">
      ERP Multi-Tenant System &mdash; Built with Express + MySQL
    </div>
  </div>

  <div class="toast" id="toast">📋 Path copied to clipboard!</div>

  <script>
    const CATEGORIES = {
      system: { label: '⚙️  System & Health', endpoints: ['health', 'auth'] },
      master: { label: '📦  Master Data', endpoints: ['users', 'roles', 'permissions', 'accounts', 'itemCategories', 'items', 'warehouses', 'customers', 'suppliers', 'taxRates'] },
      inventory: { label: '📊  Inventory', endpoints: ['stockAdjustments', 'stockTransfers', 'inventory'] },
      sales: { label: '💰  Sales', endpoints: ['quotations', 'salesOrders', 'deliveryNotes', 'salesInvoices', 'salesReturns', 'creditNotes', 'customerPayments'] },
      purchase: { label: '📋  Purchases', endpoints: ['purchaseRequests', 'purchaseOrders', 'goodsReceipts', 'purchaseInvoices', 'purchaseReturns', 'debitNotes', 'supplierPayments'] },
      financial: { label: '🏦  Financial', endpoints: ['journalEntries', 'generalLedger', 'bankAccounts', 'bankTransactions', 'bankReconciliations', 'paymentReceipts', 'paymentVouchers'] },
    };

    const ENDPOINT_DETAILS = {
      health:      { path: '/api/health',              method: 'GET',  desc: 'Health check & server status' },
      auth:        { path: '/api/auth',                 method: 'POST', desc: 'Authentication endpoints' },
      users:       { path: '/api/users',                method: 'GET',  desc: 'User management' },
      roles:       { path: '/api/roles',                method: 'GET',  desc: 'Role management' },
      permissions: { path: '/api/permissions',          method: 'GET',  desc: 'Permission management' },
      accounts:    { path: '/api/accounts',             method: 'GET',  desc: 'Chart of accounts' },
      itemCategories: { path: '/api/item-categories',   method: 'GET',  desc: 'Item category master' },
      items:       { path: '/api/items',                method: 'GET',  desc: 'Item/product master' },
      warehouses:  { path: '/api/warehouses',           method: 'GET',  desc: 'Warehouse management' },
      stockAdjustments: { path: '/api/stock-adjustments', method: 'GET', desc: 'Stock adjustments' },
      stockTransfers: { path: '/api/stock-transfers',   method: 'GET',  desc: 'Stock transfers' },
      inventory:   { path: '/api/inventory',            method: 'GET',  desc: 'Inventory balances & transactions' },
      customers:   { path: '/api/customers',            method: 'GET',  desc: 'Customer master' },
      quotations:  { path: '/api/quotations',           method: 'GET',  desc: 'Sales quotations' },
      salesOrders: { path: '/api/sales-orders',         method: 'GET',  desc: 'Sales orders' },
      deliveryNotes: { path: '/api/delivery-notes',     method: 'GET',  desc: 'Delivery notes' },
      salesInvoices: { path: '/api/sales-invoices',     method: 'GET',  desc: 'Sales invoices' },
      salesReturns: { path: '/api/sales-returns',       method: 'GET',  desc: 'Sales returns' },
      creditNotes: { path: '/api/credit-notes',         method: 'GET',  desc: 'Credit notes' },
      customerPayments: { path: '/api/customer-payments', method: 'GET', desc: 'Customer payments' },
      suppliers:   { path: '/api/suppliers',            method: 'GET',  desc: 'Supplier master' },
      purchaseRequests: { path: '/api/purchase-requests', method: 'GET', desc: 'Purchase requests' },
      purchaseOrders: { path: '/api/purchase-orders',   method: 'GET',  desc: 'Purchase orders' },
      goodsReceipts: { path: '/api/goods-receipts',     method: 'GET',  desc: 'Goods receipts' },
      purchaseInvoices: { path: '/api/purchase-invoices', method: 'GET', desc: 'Purchase invoices' },
      purchaseReturns: { path: '/api/purchase-returns', method: 'GET',  desc: 'Purchase returns' },
      debitNotes:  { path: '/api/debit-notes',          method: 'GET',  desc: 'Debit notes' },
      supplierPayments: { path: '/api/supplier-payments', method: 'GET', desc: 'Supplier payments' },
      bankAccounts: { path: '/api/bank-accounts',       method: 'GET',  desc: 'Bank account master' },
      bankTransactions: { path: '/api/bank-transactions', method: 'GET', desc: 'Bank transactions' },
      paymentReceipts: { path: '/api/payment-receipts', method: 'GET',  desc: 'Payment receipts' },
      paymentVouchers: { path: '/api/payment-vouchers', method: 'GET',  desc: 'Payment vouchers' },
      bankReconciliations: { path: '/api/bank-reconciliations', method: 'GET', desc: 'Bank reconciliations' },
      tenant:      { path: '/api/tenant',               method: 'GET',  desc: 'Tenant management' },
    };

    let currentFilter = 'all';

    function renderEndpoints(filter = 'all', search = '') {
      const container = document.getElementById('endpointsContainer');
      container.innerHTML = '';
      let total = 0;

      for (const [catKey, category] of Object.entries(CATEGORIES)) {
        const matchingEndpoints = category.endpoints.filter(key => {
          const ep = ENDPOINT_DETAILS[key];
          if (!ep) return false;
          const methodMatch = filter === 'all' || ep.method.toLowerCase() === filter;
          const searchMatch = !search ||
            ep.path.toLowerCase().includes(search) ||
            ep.desc.toLowerCase().includes(search) ||
            key.toLowerCase().includes(search);
          return methodMatch && searchMatch;
        });

        if (matchingEndpoints.length === 0) continue;
        total += matchingEndpoints.length;

        const section = document.createElement('div');
        section.className = 'category';
        section.innerHTML = `<h2>${category.label}</h2><div class="endpoint-grid">${matchingEndpoints.map(key => {
          const ep = ENDPOINT_DETAILS[key];
          return `<a href="${ep.path}" class="endpoint-card" target="_blank" onclick="return copyPath(event, '${ep.path}')">
            <span class="method-badge ${ep.method.toLowerCase()}">${ep.method}</span>
            <div class="endpoint-info">
              <div class="endpoint-path">${ep.path}</div>
              <div class="endpoint-desc">${ep.desc}</div>
            </div>
            <span class="endpoint-icon">↗</span>
          </a>`;
        }).join('')}</div>`;
        container.appendChild(section);
      }

      document.getElementById('totalEndpoints').textContent = total;
    }

    function filterEndpoints() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      renderEndpoints(currentFilter, search);
    }

    function setFilter(method, btn) {
      currentFilter = method;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterEndpoints();
    }

    function copyPath(e, path) {
      // Ctrl+Click or Cmd+Click opens in new tab; regular click copies
      if (e.ctrlKey || e.metaKey) return true;
      e.preventDefault();
      navigator.clipboard.writeText(window.location.origin + path).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
      return false;
    }

    renderEndpoints();
  </script>
</body>
</html>
